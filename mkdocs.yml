site_name: DIRAC Project 
site_url: https://diracgrid.org/
site_description: Homepage of the DIRAC Project documentation
site_author: Andrei Tsaregorodtsev
use_directory_urls: false

# Theming
theme:
  name: material
  language: en
  custom_dir: docs/overrides/
  logo: assets/images/Dirac_logo_black-white-negative.png
  favicon: assets/images/Dirac_favicon_logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/theme-light-dark
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
  icon:
    admonition:
      info: octicons/info-16

extra_css:
  - assets/stylesheets/diracgrid.css      

# Content
nav:
  - About: dirac.md
  - Code: code.md
  - Documentation: documentation.md
  - Users: users.md
  - Events: events.md
  - Consortium: consortium.md
  - Contacts: contacts.md

extra:
  homepage: ../index.html

# Plugins
plugins:
  - search
copyright: Copyright &copy; DIRAC Consortium

# Mkdocs material extensions
# https://squidfunk.github.io/mkdocs-material/extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true


